name: Keep Render Alive

on:
  schedule:
    - cron: "*/5 * * * *" # mỗi 5 phút
  workflow_dispatch: # cho phép chạy tay

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render App
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://betrelloclone.onrender.com/api/v1/health
